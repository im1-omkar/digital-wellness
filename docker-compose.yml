services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellness}
      POSTGRES_DB: ${POSTGRES_DB:-wellness_hub}
    ports:
      - "5432:5432"
    volumes:
      - wellness_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wellness} -d ${POSTGRES_DB:-wellness_hub}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wellness_postgres:
